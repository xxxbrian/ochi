name: ochi

services:
  db:
    build: ./db
    image: ochi-postgres:local
    environment:
      POSTGRES_DB: ochi
      POSTGRES_USER: ochi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ochi -d ochi"]
      interval: 3s
      timeout: 3s
      retries: 15

  server:
    build: ./server
    environment:
      ADDR: :8080
      DATABASE_URL: postgres://ochi:${POSTGRES_PASSWORD}@db:5432/ochi?sslmode=disable
      OCHI_USERS: ${OCHI_USERS:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      RUNNER: ${RUNNER:-openai}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      WORKSPACE_ENABLED: ${WORKSPACE_ENABLED:-true}
      WORKSPACE_IMAGE: ochi-workspace:local
      WORKSPACE_NETWORK: ochi
      COMPUTE_NETWORK: ochi-compute
      ARTIFACTS_ROOT: /var/lib/ochi/artifacts
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - artifacts:/var/lib/ochi/artifacts
    depends_on:
      db: {condition: service_healthy}
    networks: [app, compute]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 15
    stop_grace_period: 700s

  web:
    build: ./web
    ports: ["127.0.0.1:8090:80"]
    depends_on: [server]
    networks: [app]

  # Build-only template. The Go service creates a container/volume for each user.
  workspace-image:
    build: ./workspace
    image: ochi-workspace:local
    profiles: [build]
    networks: [app]

volumes:
  database:
  artifacts:

networks:
  app:
    name: ochi
  compute:
    name: ochi-compute
