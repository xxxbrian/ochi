name: ochi

services:
  db:
    build: ./db
    image: ${OCHI_POSTGRES_IMAGE:-ochi-postgres:local}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ochi
      POSTGRES_USER: ochi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ochi -d ochi"]
      interval: 3s
      timeout: 3s
      retries: 15

  server:
    build: .
    image: ${OCHI_SERVER_IMAGE:-ochi-server:local}
    restart: unless-stopped
    ports: ["127.0.0.1:8090:8080"]
    environment:
      ADDR: :8080
      DATABASE_URL: postgres://ochi:${POSTGRES_PASSWORD}@db:5432/ochi?sslmode=disable
      OCHI_USERS: ${OCHI_USERS:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      RUNNER: ${RUNNER:-openai}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      WORKSPACE_ENABLED: ${WORKSPACE_ENABLED:-true}
      WORKSPACE_IMAGE: ${OCHI_WORKSPACE_IMAGE:-ochi-workspace:local}
      WORKSPACE_NETWORK: ochi
      COMPUTE_NETWORK: ochi-compute
      ARTIFACTS_ROOT: /var/lib/ochi/artifacts
      OCHI_UPDATE_URL: ${OCHI_UPDATE_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - artifacts:/var/lib/ochi/artifacts
    depends_on:
      db: {condition: service_healthy}
      workspace-image: {condition: service_completed_successfully}
    networks: [app, compute]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 15
    stop_grace_period: 700s

  # Preload the tool image. The Go service creates each user's real desktop.
  workspace-image:
    build: ./workspace
    image: ${OCHI_WORKSPACE_IMAGE:-ochi-workspace:local}
    entrypoint: [/bin/true]
    command: []
    working_dir: /tmp
    restart: "no"
    network_mode: none
    tmpfs: [/data]

volumes:
  database:
  artifacts:

networks:
  app:
    name: ochi
  compute:
    name: ochi-compute
