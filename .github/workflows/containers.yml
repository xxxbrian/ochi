name: Containers

on:
  push:
    branches: [main]
    paths:
      - server/**
      - web/**
      - db/**
      - workspace/**
      - Dockerfile
      - .dockerignore
      - compose.dokploy.yaml
      - scripts/deploy.py
      - scripts/release.py
      - scripts/tests/**
      - .github/workflows/containers.yml
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild unchanged database/workspace images too
        type: boolean
        default: false

# Finish publishing one complete bundle before replacing the rolling feed.
concurrency:
  group: ochi-containers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      built_at: ${{ steps.metadata.outputs.built_at }}
      attempt: ${{ steps.metadata.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Identify application build
        id: metadata
        run: |
          python3 scripts/release.py metadata >> "$GITHUB_OUTPUT"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Check build tooling and server
        run: |
          python3 -B -m unittest discover -s scripts/tests -v
          python3 -B -m unittest discover -s workspace/tests -v
          cd server
          go test ./...
          go vet ./...
      - name: Check Web and cross-client contracts
        run: |
          corepack enable
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web test

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        component: [server, postgres, workspace]
        target:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Identify image context
        id: context
        env:
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.target.arch }}
          BUILD_ATTEMPT: ${{ needs.check.outputs.attempt }}
        run: |
          directory="$COMPONENT"
          if [ "$COMPONENT" = postgres ]; then directory=db; fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}-$COMPONENT"
          if [ "$COMPONENT" = server ]; then
            directory=.
            tag="$image:sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-$BUILD_ATTEMPT-$ARCH"
          else
            tree="$(git rev-parse "HEAD:$directory")"
            tag="$image:ctx-$tree-$ARCH"
          fi
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Reuse unchanged database or workspace
        if: matrix.component != 'server'
        id: reuse
        env:
          TAG: ${{ steps.context.outputs.tag }}
          REBUILD: ${{ inputs.rebuild || false }}
        run: |
          if [ "$REBUILD" != true ]; then
            if digest="$(docker buildx imagetools inspect "$TAG" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
              echo "found=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Build and publish component
        if: steps.reuse.outputs.found != 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ steps.context.outputs.directory }}
          platforms: linux/${{ matrix.target.arch }}
          tags: ${{ steps.context.outputs.tag }}
          push: true
          pull: true
          provenance: mode=max
          sbom: true
          build-args: |
            REVISION=${{ github.sha }}
            BUILT_AT=${{ needs.check.outputs.built_at }}
            BUILD_TYPE=release
          cache-from: type=registry,ref=${{ steps.context.outputs.image }}:cache-${{ matrix.target.arch }}
          cache-to: type=registry,ref=${{ steps.context.outputs.image }}:cache-${{ matrix.target.arch }},mode=max
          labels: |
            org.opencontainers.image.title=Ochi ${{ matrix.component }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Export the same embedded application binary
        if: matrix.component == 'server'
        env:
          ARCH: ${{ matrix.target.arch }}
          BUILT_AT: ${{ needs.check.outputs.built_at }}
          BUILD_ATTEMPT: ${{ needs.check.outputs.attempt }}
        run: |
          docker buildx build --platform "linux/$ARCH" --target binary \
            --build-arg "REVISION=$GITHUB_SHA" --build-arg "BUILT_AT=$BUILT_AT" \
            --build-arg BUILD_TYPE=release --output type=local,dest=exported .
          python3 scripts/release.py package --binary exported/ochi-server --arch "$ARCH" \
            --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$BUILD_ATTEMPT" \
            --directory release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.component == 'server'
        with:
          name: binary-${{ matrix.target.arch }}
          path: release/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Save component identity
        env:
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.target.arch }}
          IMAGE: ${{ steps.context.outputs.image }}
          DIGEST: ${{ steps.reuse.outputs.digest || steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p digests
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > "digests/$COMPONENT-$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.component }}-${{ matrix.target.arch }}
          path: digests/*
          retention-days: 7
          overwrite: true

  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: release
          merge-multiple: true
      - name: Assemble multi-platform deployment bundle
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          BUILD_ATTEMPT: ${{ needs.check.outputs.attempt }}
        run: |
          mkdir -p bundle
          tag="sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-$BUILD_ATTEMPT"
          for component in server postgres workspace; do
            image="${IMAGE_PREFIX,,}-$component"
            docker buildx imagetools create --tag "$image:$tag" \
              "$(cat "digests/$component-amd64")" "$(cat "digests/$component-arm64")"
            digest="$(docker buildx imagetools inspect "$image:$tag" --format '{{.Manifest.Digest}}')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s@%s\n' "$image" "$digest" > "bundle/$component"
          done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          images = {name: Path(f"bundle/{name}").read_text().strip() for name in ("server", "postgres", "workspace")}
          Path("bundle/images.json").write_text(json.dumps({"revision": os.environ["GITHUB_SHA"], "images": images}, indent=2) + "\n")
          PY
          python3 scripts/deploy.py render --bundle bundle/images.json --output bundle/compose.yaml
          POSTGRES_PASSWORD=compose-validation OCHI_USERS='[]' docker compose --env-file /dev/null -f bundle/compose.yaml config --quiet
      - name: Render verified application update feed
        env:
          BUILT_AT: ${{ needs.check.outputs.built_at }}
          BUILD_ATTEMPT: ${{ needs.check.outputs.attempt }}
        run: |
          python3 scripts/release.py manifest --directory release --repository "$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$BUILD_ATTEMPT" \
            --built-at "$BUILT_AT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-${{ github.sha }}-${{ github.run_id }}-${{ needs.check.outputs.attempt }}
          path: |
            bundle/images.json
            bundle/compose.yaml
            release/update.json
          retention-days: 90
          overwrite: true
      - name: Check main before updating rolling pointers
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          git fetch --no-tags --depth=1 origin "$head"
          if git diff --quiet "$GITHUB_SHA" "$head" -- \
            server web db workspace Dockerfile .dockerignore compose.dokploy.yaml \
            scripts/deploy.py scripts/release.py scripts/tests .github/workflows/containers.yml; then
            echo 'latest=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Build retained; a newer source revision will publish the rolling feed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Update edge image aliases
        if: steps.current.outputs.latest == 'true'
        run: |
          for component in server postgres workspace; do
            ref="$(cat "bundle/$component")"
            docker buildx imagetools create --tag "${ref%@*}:edge" "$ref"
          done
      - name: Publish rolling application update
        if: steps.current.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view edge --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create edge --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Ochi development builds' --prerelease --latest=false \
              --notes 'Rolling application update channel. Builds publish automatically; installations update only when an administrator requests it.'
          fi
          # Archives never overwrite older downloads. Publish the pointer last,
          # only after both architectures are durably available on the release.
          for archive in release/*.tar.gz; do
            name="$(basename "$archive")"
            expected="sha256:$(sha256sum "$archive" | cut -d ' ' -f 1)"
            existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/edge" --jq ".assets[] | select(.name == \"$name\") | .digest")"
            if [ -z "$existing" ]; then
              gh release upload edge "$archive" --repo "$GITHUB_REPOSITORY"
            elif [ "$existing" != "$expected" ]; then
              echo "Existing immutable asset $name has a different checksum; refusing to replace it." >&2
              exit 1
            fi
          done
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/edge" \
            -f "sha=$GITHUB_SHA" -F force=true >/dev/null
          gh release edit edge --repo "$GITHUB_REPOSITORY" --prerelease --latest=false
          gh release upload edge release/update.json --clobber --repo "$GITHUB_REPOSITORY"
          printf 'Images and application update %s are ready. No installation was deployed or restarted.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
