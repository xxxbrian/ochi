<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1500" viewBox="0 0 1440 1500" role="img" aria-labelledby="title desc">
<title id="title">Parallel where possible.</title>
<desc id="desc">Ordinary commands, Jobs, files and public HTTP default to per-conversation compute. Persistent Linux desktop, shared browser, project files and extensions require Computer permission. Ready overlapping resource requests enter atomic FIFO admission. Foreground waits checkpoint and park without leases or background execution; explicit continuation keeps priority and re-observes the desktop. Actual running Jobs retain resource claims until drained.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#171717" stroke-width="1.5"/></marker>
  <marker id="fine-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#858582" stroke-width="1.4"/></marker>
</defs>
<style>
  text { font-family:Geist,Arial,sans-serif; fill:#171717; }
  .mono { font-family:"Geist Mono","SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace; }
  .eyebrow { font-size:16px; letter-spacing:1px; }
  .title { font-size:48px; font-weight:700; letter-spacing:-1.5px; }
  .subtitle { font-size:21px; fill:#5c5c5c; }
  .section { font-size:17px; font-weight:500; letter-spacing:.4px; }
  .station { font-size:28px; font-weight:650; letter-spacing:-.5px; }
  .body { font-size:20px; }
  .detail { font-size:18px; fill:#5c5c5c; }
  .micro { font-size:16px; fill:#5c5c5c; }
  .large { font-size:36px; font-weight:650; letter-spacing:-.7px; }
  .flow { fill:none; stroke:#171717; stroke-width:2.3; marker-end:url(#arrow); }
  .fine { fill:none; stroke:#858582; stroke-width:1.5; marker-end:url(#fine-arrow); }
  .rule { stroke:#d7d7d4; stroke-width:1; }
</style>
<rect width="1440" height="1500" fill="#fcfcfb"/>
<text x="64" y="54" class="mono eyebrow">04 / COMPUTE &amp; SHARED RESOURCES</text>
<text x="1376" y="54" class="mono eyebrow" text-anchor="end">OCHI / SYSTEM NOTES</text>
<line x1="64" y1="72" x2="1376" y2="72" class="rule"/>
<text x="64" y="132" class="title">Parallel where possible.</text>
<text x="64" y="173" class="subtitle">Use isolated compute by default. Queue only the shared resources the work actually needs.</text>
<text x="64" y="244" class="mono section">01 / TWO EXPLICIT ENVIRONMENTS</text>
<line x1="464" y1="278" x2="464" y2="1114" class="rule"/>
<text x="64" y="302" class="large">Compute</text>
<text x="64" y="340" class="mono micro">PER CONVERSATION</text>
<line x1="64" y1="361" x2="400" y2="361" class="rule"/>
<text x="64" y="403" class="body">Commands / Jobs / files</text>
<text x="64" y="435" class="body">Public HTTP / analysis</text>
<text x="64" y="490" class="body">Independent by default.</text>
<text x="64" y="526" class="detail">No shared desktop lease.</text>
<text x="64" y="556" class="detail">No persistent workspace mount.</text>
<text x="520" y="302" class="large">Persistent Computer</text>
<text x="520" y="340" class="mono micro">LINUX DESKTOP / SHARED BROWSER / PROJECT FILES / EXTENSIONS</text>
<line x1="520" y1="361" x2="1376" y2="361" class="rule"/>
<text x="520" y="403" class="body">Computer permission + scoped tools</text>
<text x="520" y="435" class="detail">Acquire the complete resource set atomically, or wait for it.</text>
<text x="520" y="486" class="mono micro">READY REQUESTS WITH OVERLAPPING KEYS</text>
<rect x="520" y="511" width="208" height="62" fill="none" stroke="#d7d7d4"/>
<text x="538" y="549" class="mono section">01</text>
<text x="588" y="549" class="body">earlier</text>
<path d="M734 542 H752" class="fine"/>
<rect x="760" y="511" width="208" height="62" fill="none" stroke="#d7d7d4"/>
<text x="778" y="549" class="mono section">02</text>
<text x="828" y="549" class="body">next</text>
<path d="M974 542 H992" class="fine"/>
<rect x="1000" y="511" width="208" height="62" fill="none" stroke="#d7d7d4"/>
<text x="1018" y="549" class="mono section">03</text>
<text x="1068" y="549" class="body">later</text>
<text x="1376" y="549" class="mono section" text-anchor="end">FIFO</text>
<text x="520" y="606" class="detail">Manual control uses the same admission. Independent resources can proceed.</text>
<text x="64" y="661" class="mono micro">EXPLICIT FILE COPY</text>
<text x="64" y="701" class="station">One selected file</text>
<text x="64" y="741" class="detail">files_copy crosses environments.</text>
<text x="64" y="771" class="detail">Identical paths are different files.</text>
<path d="M398 723 H490" class="fine"/>
<text x="64" y="873" class="mono micro">OWNED JOBS</text>
<text x="64" y="914" class="station">Task or service</text>
<text x="64" y="953" class="detail">Finite tasks end with the run.</text>
<text x="64" y="983" class="detail">Explicit services may survive</text>
<text x="64" y="1013" class="detail">successful completion.</text>
<text x="520" y="667" class="mono section">02 / FOREGROUND ADMISSION</text>
<rect x="520" y="700" width="368" height="112" fill="#171717" stroke="#171717"/>
<text x="544" y="737" class="mono section" style="fill:#d4d4d4">BLOCKING WAIT</text>
<text x="544" y="782" class="body" style="fill:#ffffff">2 / 4 / 8 / up to 15 min</text>
<path d="M908 756 H1006" class="flow"/>
<rect x="1030" y="700" width="346" height="112" fill="none" stroke="#d7d7d4"/>
<text x="1054" y="737" class="mono section">GRANTED</text>
<text x="1054" y="782" class="body">Observe fresh desktop state.</text>
<text x="1030" y="855" class="detail">Then choose the next action.</text>
<text x="1030" y="887" class="detail">Never replay stale clicks.</text>
<path d="M704 812 V916" class="flow"/>
<text x="728" y="855" class="mono micro">reporting checkpoint</text>
<text x="728" y="883" class="mono micro">elapsed + queue counts</text>
<rect x="520" y="940" width="368" height="174" fill="#f1f1ef" stroke="#d7d7d4"/>
<text x="544" y="979" class="mono section">PARKED / NOT RUNNING</text>
<text x="544" y="1017" class="body">Original priority. No lease.</text>
<text x="544" y="1052" class="detail">No expiry or background grant.</text>
<text x="544" y="1088" class="detail">Continue = another blocking wait.</text>
<path d="M520 1068 H492 V756 H520" class="fine"/>
<text x="520" y="1156" class="detail">Parked entries do not block ready waiters. Cancel when choosing another approach.</text>
<text x="520" y="1188" class="detail">Expanding the resource set releases the old segment before queueing the full new set.</text>
<text x="64" y="1241" class="mono section">03 / REAL PROCESSES KEEP THEIR CLAIMS</text>
<line x1="64" y1="1273" x2="1376" y2="1273" class="rule"/>
<text x="64" y="1316" class="body">A Go lease ending does not stop a live desktop Job.</text>
<text x="64" y="1350" class="detail">Process authority must confirm it drained before another GUI action,</text>
<text x="64" y="1380" class="detail">including an action from the same conversation. Job inspection stays available.</text>
<text x="1030" y="1316" class="mono micro">REVOKING COMPUTER</text>
<text x="1030" y="1350" class="detail">Clears desktop Jobs.</text>
<text x="1030" y="1380" class="detail">Independent compute continues.</text>
<line x1="64" y1="1434" x2="1376" y2="1434" class="rule"/>
<text x="64" y="1470" class="detail">The persistent desktop is a Linux environment, not the user&#x27;s phone or host computer.</text>
</svg>
