<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#ffffff" />
        <meta name="application-name" content="Ochi" />
        <title>Ochi</title>
        <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
        <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
        <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
        <link rel="preload" href="/fonts/geist-variable.woff2" as="font" type="font/woff2" crossorigin />
    </head>
    <body>
        <script>
            // Appearance is restored before first paint: theme (light | dark | system), look (quiet | mono), canvas (paper | flat).
            try {
                const root = document.documentElement
                const apply = (dark) => {
                    root.dataset.theme = dark ? 'dark' : 'light'
                    root.classList.toggle('dark', dark)
                }
                const t = localStorage.getItem('assistant.theme.v1')
                if (t === 'system') {
                    const query = matchMedia('(prefers-color-scheme: dark)')
                    apply(query.matches)
                    query.addEventListener('change', (event) => {
                        if (localStorage.getItem('assistant.theme.v1') === 'system') apply(event.matches)
                    })
                } else if (t === 'dark') apply(true)
                if (localStorage.getItem('assistant.look.v1') === 'mono') root.dataset.look = 'mono'
                if (localStorage.getItem('assistant.canvas.v1') === 'flat') root.dataset.canvas = 'flat'
            } catch {}
        </script>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
